# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: omarket

before:
  hooks:
    - go test ./...

builds:
  - id: omarket
    main: ./cmd/omarket
    binary: omarket
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X github.com/aphexddb/omarket/internal/version.Version={{.Version}}
      - -X github.com/aphexddb/omarket/internal/version.Commit={{.ShortCommit}}
      - -X github.com/aphexddb/omarket/internal/version.Date={{.Date}}

  - id: sharewarectl
    main: ./cmd/sharewarectl
    binary: sharewarectl
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X github.com/aphexddb/omarket/internal/version.Version={{.Version}}
      - -X github.com/aphexddb/omarket/internal/version.Commit={{.ShortCommit}}
      - -X github.com/aphexddb/omarket/internal/version.Date={{.Date}}

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE.md
      - README.md

checksum:
  name_template: checksums.txt

aurs:
  - name: omarket-bin
    homepage: https://omarket.dev
    description: "omarket CLI: browse, buy, and install shareware from the omarket platform"
    maintainers:
      - "Gardiner Allen <aphexddb@gmail.com>"
    license: MIT
    provides:
      - omarket
    conflicts:
      - omarket
    private_key: "{{ .Env.AUR_KEY }}"
    git_url: ssh://aur@aur.archlinux.org/omarket-bin.git
    # Skip publishing when no deploy key is configured (e.g. forks, local
    # snapshot builds) so goreleaser still succeeds without AUR_KEY set. The
    # release workflow must set the AUR_KEY secret for real releases to
    # actually publish to AUR.
    skip_upload: "{{ if .Env.AUR_KEY }}false{{ else }}true{{ end }}"
    commit_author:
      name: Gardiner Allen
      email: aphexddb@gmail.com
    commit_msg_template: "chore: update omarket-bin to {{ .Tag }}"
    package: |-
      install -Dm755 "./omarket" "${pkgdir}/usr/bin/omarket"
      install -Dm755 "./sharewarectl" "${pkgdir}/usr/bin/sharewarectl"
      install -Dm644 "./LICENSE.md" "${pkgdir}/usr/share/licenses/${pkgname}/LICENSE"
      install -Dm644 "./README.md" "${pkgdir}/usr/share/doc/${pkgname}/README.md"

changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge branch

snapshot:
  version_template: "{{ .Version }}-next"

release:
  name_template: "v{{ .Version }}"
  footer: >-

    ---

    Released by [GoReleaser](https://github.com/goreleaser/goreleaser).
