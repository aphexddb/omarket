[package]
name = "hello-shareware"
version = "1.0.0"
edition = "2021"
publish = false

[dependencies]
# Ed25519 verification. `verify_strict` is the one to use: it rejects the
# small-order public keys and non-canonical encodings that plain `verify`
# accepts.
ed25519-dalek = "2"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
